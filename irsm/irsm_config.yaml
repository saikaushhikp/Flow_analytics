aggregation:
  max_frame_gap_sec: 0.5
  method: average
  min_avg_frames: 3
  window_sec: 1.0
calibration:
  method: sigmoid
data:
  input_dir: data
  output_base: irsm
date: '2025-06-03'
ensemble:
  weights:
    gaussian: 0.4
    iforest: 0.4
    kinetic_bonus: 0.2
evaluation:
  canonical_dir: irsm/results/brussels
  end_date: '2025-06-07'
  gold_path: brussels_june_in.csv
  start_date: '2025-06-01'
feature_sets:
  safety_core:
  - mdrac
  - ttc
  - closing_speed
  - closing_accel
  - speed_diff
  - yaw_diff
  - yaw_rate
  - ttc_severity_score
  - traj_severity_score
  - env_severity_score
  - decel_avg_deceleration
  - decel_max_deceleration
model:
  contamination: 0.001
  feature_cols:
  - mdrac
  - distance
  - closing_speed
  - closing_accel
  - speed_diff
  - ttc
  - yaw_diff
  - yaw_rate
  - min_safe_dist
  - ttc_min_dist
  - ttc_severity_score
  - traj_min_dist
  - traj_time_horizon
  - traj_severity_score
  - env_min_dist
  - env_max_overlap_prob
  - env_time_horizon
  - env_severity_score
  - decel_initial_speed
  - decel_final_speed
  - decel_speed_change
  - decel_avg_deceleration
  - decel_max_deceleration
  - decel_observation_time
  - decel_num_frames_observed
  - decel_alignment
  - decel_model
  n_estimators: 150
  random_state: 2026
output:
  save_per_zone: false
pair_generation:
  include_non_approaching: false
  max_distance: 10.0
  max_lateral: 2.0
  max_ttc: 13.0
  min_avg_mdrac_threshold: 1.0
  min_closing_speed: 0.1
preprocessing:
  crosswalk: true
  footpath: true
  lifetime: true
  static: true
prt:
  bicycle: 1.0
  bus: 1.8
  car: 1.5
  default: 1.5
  motorcycle: 1.3
  truck: 2.0
region: brussels
thresholds:
  crosswalks:
    avg_window: 0.3
    max_ttc: 0.8
    min_avg_frames: 1
    min_duration: 0.1
    min_mdrac: 3.4
    min_speed_diff: 0.5
    yaw_diff_rate_threshold: 10.0
  lanes:
    closing_accel_threshold: -0.3
    max_lateral_distance: 1.2
    max_ttc: 1.0
    min_avg_frames: 3
    min_duration: 0.2
    min_mdrac: 3.4
    min_speed_diff: 0.5
zones:
  focus: lanes
